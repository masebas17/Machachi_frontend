<section class="Formulario">
  <div class="container">
    <div class="row">
      <div class="col-sm-12 letras">
        <h1 class="titulo">Registro de Aprobación Final</h1>
        <h5 *ngIf="name_level">
          {{ "Nivel: " + name_level + " - " + "Paralelo: " + name_course }}
        </h5>
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-sm-9">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead class="table-secondary">
              <tr class="text-center">
                <th>Ord</th>
                <th>Alumno</th>
                <th>Aprueba el nivel</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let enrollment of enrollments; let i = index">
                <td class="text-center">{{ i + 1 }}</td>
                <td>
                  {{
                    enrollment.Student.lastName + " " + enrollment.Student.name
                      | uppercase
                  }}
                </td>
                <td class="text-center">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    [checked]="aprobados.has(enrollment.id)"
                    [disabled]="bloqueado"
                    (change)="toggleAprobado(enrollment.id)"
                  />
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="row mt-4" *ngIf="enrollments.length > 0">
      <div class="col-sm-6">
        <div class="botones">
          <button
            class="btn btn-success"
            (click)="guardarAprobaciones()"
            [disabled]="bloqueado"
          >
            <fa-icon [icon]="faSave"></fa-icon> Guardar Aprobación
          </button>
          <a href="/teacher/mycourses" class="btn btn-outline-danger mx-2"
            ><fa-icon [icon]="faArrowAltCircleLeft"></fa-icon> Salir</a
          >
        </div>
      </div>
    </div>
  </div>
</section>
